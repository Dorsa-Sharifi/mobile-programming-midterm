name: sensor_dashboard_app
description: "A secure and comprehensive device sensors dashboard."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  local_auth: ^3.0.1
  sensors_plus: ^6.1.1
  flutter_compass: ^0.8.1
  geolocator: ^14.0.3
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  light_sensor: any
  pedometer: ^4.0.1
  nfc_manager: ^4.1.1
  shake: ^3.0.0
  proximity_sensor: ^1.4.0
  permission_handler: ^12.0.3


flutter:
  uses-material-design: true
  assets:
    - assets/parallax_bg.jpg
    - assets/compass_dial.png
